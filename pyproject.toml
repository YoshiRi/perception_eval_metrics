[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "perception-eval-metrics"
version = "0.1.0"
description = "NuScenes-inspired safety-critical detection metrics and GT-EST re-matching for perception_eval CSV output"
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.3",
    "numpy>=1.21",
    "scipy>=1.7",
    "pyyaml>=5.4",
]

[tool.setuptools.packages.find]
include = ["rematch*", "safety_metrics*", "occupancy_metrics*"]
