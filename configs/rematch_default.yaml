# Standard re-matching
# - Threshold 2.0m for all classes (matches approximate upper bound of original matching)
# - Strict label matching (car↔car only)
# - No visibility or confidence filter

label: rematch_default

csv_path: path/to/current.csv   # required: override via --csv or edit here
output_dir: output/rematch/default

distance_thresholds_m:
  __default__: 2.0

label_match: strict
label_groups: null

confidence_min: 0.0
visibility_exclude_from_gt: []

algorithm: hungarian
