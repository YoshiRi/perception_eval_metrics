csv_path: path/to/current.csv
output_dir: output/occupancy/default

label: occupancy_default

# Grid settings
resolution_m: 0.5
range_m: 80.0

# Evaluation scope
classes:
  - car
  - truck
  - bus
  - pedestrian
visibility_exclude:
  - NONE

# Distance weighting: "inverse_square" (1/r²) or "uniform"
distance_weight_type: inverse_square

# Polar / Stixel settings
n_rays: 360
polar_max_range_m: 80.0

# CSV column mapping (adjust to match your CSV)
col_x: x
col_y: y
col_w: w
col_l: l
col_yaw: yaw

# Label-based default bbox sizes [length_m, width_m]
# Used when w/l/yaw columns are absent in the CSV
default_bbox_sizes:
  car: [4.5, 1.8]
  truck: [10.0, 2.5]
  bus: [12.0, 2.5]
  pedestrian: [0.5, 0.5]
  motorbike: [2.0, 0.8]
  bicycle: [1.8, 0.6]

# Fallback radius for labels not in default_bbox_sizes
point_radius_m: 1.0
