csv_path: path/to/current.csv
output_dir: output/occupancy/default

label: occupancy_default

# Grid settings
resolution_m: 0.5
range_m: 80.0

# Evaluation scope
classes:
  - car
  - truck
  - bus
  - pedestrian
visibility_exclude:
  - NONE

# Distance weighting: "inverse_square" (1/r²) or "uniform"
distance_weight_type: inverse_square

# Polar / Stixel settings
n_rays: 360
polar_max_range_m: 80.0

# Ray-based min-collision-distance TP/FP/FN (forward corridor, per class)
ray_collision_dist_threshold_m: 2.0

# Per-class lateral corridor half-width (m) from the centerline — a lane's
# worth for vehicles, narrower for pedestrians.
ray_collision_corridor_half_width_m:
  car: 1.75
  truck: 1.75
  bus: 1.75
  pedestrian: 1.0
ray_collision_corridor_default_half_width_m: 1.75

# Critical zone: narrower + nearer than the corridor above. Any FN/FP here
# is reported as a separate hard-fail count, regardless of class.
ray_collision_critical_half_width_m: 1.0
ray_collision_critical_range_m: 15.0

# Roadside VRU (pedestrian/bicycle) lost/false-detection focus: a lateral
# band *outside* the forward corridor (sidewalk/shoulder), tracked as its
# own TP/FP/FN separate from the vehicle-focused corridor above.
roadside_classes:
  - pedestrian
  - bicycle
roadside_dist_threshold_m: 2.0
roadside_lateral_min_m: 1.0
roadside_lateral_max_m: 4.5

# CSV column mapping — all five columns are required
col_x: x
col_y: y
col_w: w
col_l: l
col_yaw: yaw
